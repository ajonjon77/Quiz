<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考古題隨機測驗</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; max-width: 650px; margin: 40px auto; padding: 20px; }
    .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); position: relative; }
    h2 { color: #333; margin-top: 0; }
    .status-bar { font-size: 14px; color: #666; margin-bottom: 15px; font-weight: bold; display: flex; justify-content: space-between; background: #e9ecef; padding: 8px 15px; border-radius: 6px; }
    .btn { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 15px; }
    .btn:hover { background-color: #0056b3; }
    .btn-secondary { background-color: #6c757d; font-size: 14px; padding: 8px 12px; margin-top: 10px; width: auto; }
    .btn-secondary:hover { background-color: #5a6268; }
    .option-btn { display: block; width: 100%; text-align: left; background: #f8f9fa; border: 1px solid #ddd; padding: 12px; margin: 8px 0; border-radius: 6px; cursor: pointer; font-size: 15px; line-height: 1.4; }
    .option-btn:hover { background: #e2e6ea; }
    .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; font-weight: bold; }
    .wrong { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; font-weight: bold; }
    #loading { text-align: center; color: #666; font-size: 18px; }
    #result-msg { margin-top: 15px; font-size: 16px; font-weight: bold; text-align: left; line-height: 1.5; }
    
    .stats-badge { background-color: #e2e3e5; color: #383d41; font-size: 13px; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; font-weight: normal; }
    .comment-box { margin-top: 10px; background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; padding: 10px 12px; border-radius: 6px; font-weight: normal; font-size: 14px; }
    
    /* 筆記彈窗與編輯區 */
    .note-editor { display: none; margin-top: 12px; background: #f8f9fa; padding: 12px; border-radius: 6px; border: 1px solid #ced4da; }
    .note-editor textarea { width: 100%; height: 70px; padding: 8px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; font-family: inherit; resize: vertical; }
    
    .score-card { text-align: center; padding: 20px 0; }
    .score-card h3 { font-size: 24px; color: #28a745; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <div id="loading">⏳ 正在載入題庫中...</div>
    
    <div id="quiz-box" style="display: none;">
      <!-- 頂部進度條 -->
      <div class="status-bar">
        <span id="question-counter">第 1 題 / 本輪共 20 題</span>
        <span id="current-score-tracker">答對：0 題</span>
      </div>

      <h3 id="question-text"></h3>
      <div id="options-container"></div>
      <div id="result-msg"></div>

      <!-- 編輯筆記區塊 -->
      <div id="note-section" style="display: none;">
        <button class="btn btn-secondary" onclick="toggleNoteEditor()">📝 編輯/新增筆記</button>
        <div id="note-editor" class="note-editor">
          <textarea id="note-textarea" placeholder="輸入此題筆記或解析說明..."></textarea>
          <button class="btn btn-secondary" style="background-color: #28a745;" onclick="saveNote()">保存筆記至雲端</button>
          <span id="note-status" style="font-size: 12px; margin-left: 8px;"></span>
        </div>
      </div>

      <button class="btn" id="next-btn" onclick="nextQuestion()" style="display: none;">下一題 ➔</button>
    </div>

    <!-- 20 題結算畫面 -->
    <div id="score-box" class="score-card" style="display: none;">
      <h2>🎉 本輪測驗結束！</h2>
      <h3 id="final-score-text">得分：100 分</h3>
      <p id="score-detail-text">共答對 20 題，答錯 0 題</p>
      <button class="btn" onclick="startNewBatch()">開啟新一輪測驗</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw2CZXQn9kzdKwLxKb_G9lKTCwe5Jq9VV7RCwBk578iJw1VTtv24jaDTTJsx6eZ2B76/exec";

    let allQuestions = [];       // 完整題庫
    let availableQuestions = []; // 本輪尚未抽過的題目池
    let currentQuestion = null;
    
    // 計分與題數相關變數
    let batchQuestionCount = 0;  // 本輪已回答題數 (最多 20 題)
    let totalBatchQuestions = 20; // 本輪總題數
    let correctCount = 0;        // 本輪答對題數

    // 1. 初始化：從 Google 試算表抓取題庫
    async function fetchQuestions() {
      try {
        const response = await fetch(API_URL);
        allQuestions = await response.json();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('quiz-box').style.display = 'block';
        
        startNewBatch();
      } catch (error) {
        document.getElementById('loading').innerText = '❌ 載入題庫失敗，請檢查 API 網址與存取權限設定。';
        console.error(error);
      }
    }

    // 2. 開啟新一輪測驗
    function startNewBatch() {
      batchQuestionCount = 0;
      correctCount = 0;
      
      availableQuestions = [...allQuestions];
      totalBatchQuestions = Math.min(20, availableQuestions.length);

      document.getElementById('score-box').style.display = 'none';
      document.getElementById('quiz-box').style.display = 'block';
      nextQuestion();
    }

    // 3. 隨機抽取未重複題
    function nextQuestion() {
      if (batchQuestionCount >= totalBatchQuestions || availableQuestions.length === 0) {
        showBatchScore();
        return;
      }

      batchQuestionCount++;
      
      // 更新進度與UI重置
      document.getElementById('question-counter').innerText = `第 ${batchQuestionCount} 題 / 本輪共 ${totalBatchQuestions} 題`;
      document.getElementById('current-score-tracker').innerText = `答對：${correctCount} 題`;

      document.getElementById('result-msg').innerHTML = '';
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('note-section').style.display = 'none';
      document.getElementById('note-editor').style.display = 'none';
      document.getElementById('note-status').innerText = '';

      // 隨機選題並從池中扣除
      const randomIndex = Math.floor(Math.random() * availableQuestions.length);
      currentQuestion = availableQuestions[randomIndex];
      availableQuestions.splice(randomIndex, 1);

      document.getElementById('question-text').innerText = `${batchQuestionCount}. ${currentQuestion.question}`;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      const labels = ['A', 'B', 'C', 'D'];
      currentQuestion.options.forEach((optText, index) => {
        if (optText !== undefined && optText !== "") { 
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = `${labels[index]}. ${optText}`;
          btn.onclick = () => checkAnswer(labels[index], btn);
          optionsContainer.appendChild(btn);
        }
      });
    }

    // 4. 檢查答案與統計正確率
    async function checkAnswer(selectedOption, clickedBtn) {
      const allOptionBtns = document.querySelectorAll('.option-btn');
      allOptionBtns.forEach(btn => btn.disabled = true);

      const correctAns = String(currentQuestion.answer).trim().toUpperCase();
      const isCorrect = (selectedOption === correctAns);

      if (isCorrect) {
        correctCount++;
        clickedBtn.classList.add('correct');
      } else {
        clickedBtn.classList.add('wrong');
      }

      // 即時本地端更新統計次數 (預先計算給前端顯示)
      if (isCorrect) {
        currentQuestion.correctCount = (currentQuestion.correctCount || 0) + 1;
      } else {
        currentQuestion.wrongCount = (currentQuestion.wrongCount || 0) + 1;
      }

      // 計算此題總累積正確率
      const totalAns = currentQuestion.correctCount + currentQuestion.wrongCount;
      const accuracy = totalAns > 0 ? Math.round((currentQuestion.correctCount / totalAns) * 100) : 0;

      // 建立結果內容與正確率標籤
      let resultHTML = `<div class="stats-badge">📊 歷史答題狀況：答對 ${currentQuestion.correctCount} 次 / 答錯 ${currentQuestion.wrongCount} 次 (正確率：${accuracy}%)</div><br>`;

      if (isCorrect) {
        resultHTML += '<span style="color: green;">🎉 回答正確！</span>';
      } else {
        resultHTML += `<span style="color: red;">❌ 答錯了！正確答案是：${correctAns}</span>`;
      }

      // 若答錯且有解析說明，則顯示 comment
      if (currentQuestion.comment && currentQuestion.comment.trim() !== "") {
        resultHTML += `
          <div class="comment-box">
            💡 <strong>解析說明：</strong> <span id="displayed-comment">${currentQuestion.comment.trim()}</span>
          </div>
        `;
      }

      document.getElementById('result-msg').innerHTML = resultHTML;
      document.getElementById('current-score-tracker').innerText = `答對：${correctCount} 題`;

      // 顯示筆記編輯按鈕區塊
      document.getElementById('note-textarea').value = currentQuestion.comment || '';
      document.getElementById('note-section').style.display = 'block';

      // 顯示「下一題」按鈕
      const nextBtn = document.getElementById('next-btn');
      nextBtn.innerText = (batchQuestionCount >= totalBatchQuestions) ? "查看本輪成績 📊" : "下一題 ➔";
      nextBtn.style.display = 'block';

      // 非同步回填答題紀錄至 Google 試算表
      uploadAnswerRecord(currentQuestion.rowIndex, isCorrect);
    }

    // 5. 異步回填答題紀錄至 GAS
    function uploadAnswerRecord(rowIndex, isCorrect) {
      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: "recordAnswer",
          rowIndex: rowIndex,
          isCorrect: isCorrect
        })
      }).catch(err => console.error("紀錄回傳失敗:", err));
    }

    // 6. 開啟/隱藏筆記輸入框
    function toggleNoteEditor() {
      const editor = document.getElementById('note-editor');
      editor.style.display = (editor.style.display === 'none' || editor.style.display === '') ? 'block' : 'none';
    }

    // 7. 保存筆記至 Google 試算表
    async function saveNote() {
      const newNote = document.getElementById('note-textarea').value;
      const statusSpan = document.getElementById('note-status');
      statusSpan.innerText = "⏳ 儲存中...";

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: "updateNote",
            rowIndex: currentQuestion.rowIndex,
            comment: newNote
          })
        });

        // 本地更新變數與畫面
        currentQuestion.comment = newNote;
        statusSpan.innerText = "✅ 已保存至雲端！";

        // 動態更新當前顯示的註解
        const displayedComment = document.getElementById('displayed-comment');
        if (displayedComment) {
          displayedComment.innerText = newNote;
        }

      } catch (err) {
        statusSpan.innerText = "❌ 儲存失敗";
        console.error(err);
      }
    }

    // 8. 結算分數畫面
    function showBatchScore() {
      document.getElementById('quiz-box').style.display = 'none';
      document.getElementById('score-box').style.display = 'block';

      const finalScore = Math.round((correctCount / totalBatchQuestions) * 100);
      document.getElementById('final-score-text').innerText = `得分：${finalScore} 分`;
      document.getElementById('score-detail-text').innerText = `本輪共 ${totalBatchQuestions} 題，答對 ${correctCount} 題，答錯 ${totalBatchQuestions - correctCount} 題`;
    }

    fetchQuestions();
  </script>

</body>
</html>
